project_id = "north-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://north-alpha.vercel.app/auth/callback", "https://north-alpha.vercel.app/**", "http://localhost:3000/**", "http://127.0.0.1:3000/**"]
enable_signup = true
minimum_password_length = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no North"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha no North"
content_path = "./supabase/templates/recovery.html"
